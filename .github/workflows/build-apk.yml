name: Build StudyMind APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyMind_Source_V2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source archive
        run: |
          mkdir -p source
          unzip -q StudyMind_Source_V2.zip -d source
          test -f source/studymind_flutter/pubspec.yaml
          test -f source/studymind_flutter/lib/main.dart

      - name: Prepare Android project
        working-directory: source/studymind_flutter
        run: flutter create --platforms=android --project-name=studymind .

      - name: Get dependencies
        working-directory: source/studymind_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: source/studymind_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMind-APK
          path: source/studymind_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
