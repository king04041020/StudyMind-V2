
name: Build StudyMind APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'studymind_flutter/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        working-directory: studymind_flutter
        run: flutter create --platforms=android --project-name=studymind .

      - name: Get dependencies
        working-directory: studymind_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: studymind_flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMind-APK
          path: studymind_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
